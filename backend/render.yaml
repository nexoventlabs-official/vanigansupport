# Render service spec for the Vanigan Support backend.
#
# NOTE: This file lives inside /backend so Render's Blueprint auto-detection
# (which only reads render.yaml at the repo root) will NOT pick it up. Use
# this file as a reference when configuring the service manually via the
# Render dashboard:
#   New + → Web Service → pick this repo → set Root Directory = "backend"
# then paste the envVars below into the Environment tab.
services:
  - type: web
    name: vanigan-support-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Meta WhatsApp Cloud API
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_VERIFY_TOKEN
        sync: false
      # Cloudinary (media uploads + welcome video)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Redis (Redis Cloud) - strict message ordering + cache
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_FLUSH_ON_STARTUP
        value: "false"
